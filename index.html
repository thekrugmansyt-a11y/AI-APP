<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Пароли PRO</title>
<style>
  :root {
    --bg-1: #0a0e1a;
    --bg-2: #12182b;
    --card: rgba(30, 41, 59, 0.6);
    --card-solid: #1e293b;
    --border: rgba(148, 163, 184, 0.12);
    --text: #f1f5f9;
    --dim: #94a3b8;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --cyan: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 16px;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.22;
    z-index: -1;
    pointer-events: none;
  }
  body::before {
    width: 350px; height: 350px;
    background: var(--accent);
    top: -120px; right: -120px;
    animation: float1 20s ease-in-out infinite;
  }
  body::after {
    width: 300px; height: 300px;
    background: var(--accent-2);
    bottom: -100px; left: -100px;
    animation: float2 25s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, 60px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, -40px); } }

  .app { max-width: 500px; margin: 0 auto; }

  .hidden { display: none !important; }

  /* ============ ЭКРАН ВХОДА ============ */
  .auth-screen {
    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .auth-logo {
    text-align: center;
    font-size: 64px;
    margin-bottom: 12px;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .auth-title {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .auth-sub {
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    margin-bottom: 32px;
  }

  .auth-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .input-wrap { position: relative; }
  .input-wrap .input { padding-right: 48px; }

  .input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.25);
    border: 1.5px solid transparent;
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.25s;
    font-family: inherit;
  }
  .input:focus {
    border-color: var(--accent);
    background: rgba(99, 102, 241, 0.08);
  }
  .input::placeholder { color: var(--muted); }

  .eye-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--dim);
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.2s;
  }
  .eye-btn:hover { background: rgba(255,255,255,0.06); }

  .strength-meter {
    height: 4px;
    background: rgba(0,0,0,0.3);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: all 0.3s;
  }

  .btn-primary {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.5); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .auth-error {
    color: var(--red);
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
  }

  .auth-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.6;
  }

  /* ============ ОСНОВНОЙ ЭКРАН ============ */
  .main-screen { animation: fadeIn 0.4s ease; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .logo {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon { font-size: 24px; }
  .header-actions { display: flex; gap: 8px; }

  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
  }
  .icon-btn:hover { background: var(--accent); transform: translateY(-2px); }
  .icon-btn:active { transform: scale(0.92); }

  /* Поиск */
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .search-wrap { flex: 1; position: relative; }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    opacity: 0.5;
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 13px 16px 13px 44px;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: 0.3s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); }

  .add-btn {
    padding: 0 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
  }
  .add-btn:hover { transform: translateY(-2px); }
  .add-btn:active { transform: scale(0.95); }

  /* Статистика */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 2px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  /* Список паролей */
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .pw-card {
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    transition: all 0.2s;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .pw-card:hover { border-color: rgba(99, 102, 241, 0.3); }

  .pw-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .pw-avatar {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .pw-info { flex: 1; min-width: 0; }
  .pw-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pw-login {
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pw-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .pw-action {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(0,0,0,0.2);
    border: none;
    color: var(--dim);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }
  .pw-action:hover { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
  .pw-action:active { transform: scale(0.9); }

  .pw-password-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .pw-password {
    flex: 1;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pw-password.masked { letter-spacing: 3px; }
  .pw-strength-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--dim);
  }
  .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
  .empty-sub { font-size: 13px; }

  /* ============ МОДАЛКИ ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.2s;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--card-solid);
    border-radius: 24px 24px 0 0;
    padding: 24px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-bottom: none;
    animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .modal-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .modal-close {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
  }

  .gen-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .gen-btn {
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: rgba(99, 102, 241, 0.2);
    color: var(--accent);
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
  }
  .gen-btn:hover { background: rgba(99, 102, 241, 0.35); }
  .gen-btn:active { transform: scale(0.94); }

  .gen-length {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12px;
    color: var(--dim);
  }
  input[type="range"] {
    width: 100%;
    margin-top: 8px;
    -webkit-appearance: none;
    appearance: none;
    height: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  .btn-save {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 8px;
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
  }
  .btn-save:active { transform: scale(0.98); }

  .btn-danger {
    width: 100%;
    padding: 13px;
    border: 1.5px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px;
    background: rgba(239, 68, 68, 0.1);
    color: var(--red);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
  }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

  /* Тост */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--green);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 200;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: var(--red); box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); }

  .colored-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ ЭКРАН ВХОДА ============ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-logo">🔐</div>
    <div class="auth-title" id="authTitle">Пароли PRO</div>
    <div class="auth-sub" id="authSub">Введите мастер-пароль для входа</div>

    <div class="auth-card">
      <div class="field" id="confirmField" style="display:none;">
        <label>Повторите мастер-пароль</label>
        <div class="input-wrap">
          <input type="password" class="input" id="masterConfirm" placeholder="••••••••" autocomplete="new-password">
        </div>
      </div>

      <div class="field">
        <label>Мастер-пароль</label>
        <div class="input-wrap">
          <input type="password" class="input" id="masterInput" placeholder="••••••••" autocomplete="current-password">
          <button class="eye-btn" onclick="toggleMasterVisibility()" id="eyeBtn">👁</button>
        </div>
        <div class="strength-meter" id="masterStrengthMeter" style="display:none;">
          <div class="strength-fill" id="masterStrengthFill"></div>
        </div>
      </div>

      <button class="btn-primary" id="authBtn" onclick="handleAuth()">Войти</button>
      <div class="auth-error" id="authError"></div>
    </div>

    <div class="auth-note">
      🔒 Все данные шифруются AES-GCM в вашем браузере.<br>
      Мастер-пароль нигде не сохраняется.
    </div>
  </div>

  <!-- ============ ОСНОВНОЙ ЭКРАН ============ -->
  <div id="mainScreen" class="main-screen hidden">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🔐</span>
        <span>Пароли PRO</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙️</button>
        <button class="icon-btn" onclick="lockApp()" title="Заблокировать">🔒</button>
      </div>
    </div>

    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderList()">
      </div>
      <button class="add-btn" onclick="openAddModal()">+</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-label">Всего</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--green);" id="statStrong">0</div>
        <div class="stat-label">Надёжных</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--red);" id="statWeak">0</div>
        <div class="stat-label">Слабых</div>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<!-- ============ МОДАЛКА ДОБАВЛЕНИЯ/РЕДАКТИРОВАНИЯ ============ -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">Новый пароль</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>

    <div class="field">
      <label>Название / Сервис</label>
      <input type="text" class="input" id="editName" placeholder="Например, Google" maxlength="40">
    </div>

    <div class="field">
      <label>Логин / Email</label>
      <input type="text" class="input" id="editLogin" placeholder="example@gmail.com" maxlength="60">
    </div>

    <div class="field">
      <label>Пароль</label>
      <div class="gen-row">
        <div class="input-wrap" style="flex:1;">
          <input type="text" class="input" id="editPassword" placeholder="Введите или сгенерируйте" autocomplete="new-password">
        </div>
        <button class="gen-btn" onclick="generatePassword()" title="Сгенерировать">🎲</button>
      </div>
      <div class="gen-length">
        <span>Длина генерации</span>
        <span id="genLengthVal">16</span>
      </div>
      <input type="range" id="genLength" min="8" max="32" value="16" oninput="$('genLengthVal').textContent=this.value">
    </div>

    <div class="field">
      <label>Заметка (опционально)</label>
      <input type="text" class="input" id="editNote" placeholder="Любая информация" maxlength="100">
    </div>

    <button class="btn-save" onclick="savePassword()">💾 Сохранить</button>
    <button class="btn-danger hidden" id="deleteBtn" onclick="deletePassword()">🗑 Удалить</button>
  </div>
</div>

<!-- ============ МОДАЛКА НАСТРОЕК ============ -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">⚙️ Настройки</div>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>

    <div class="field">
      <label>Сменить мастер-пароль</label>
      <input type="password" class="input" id="newMasterInput" placeholder="Новый мастер-пароль" style="margin-bottom:8px;">
      <input type="password" class="input" id="newMasterConfirm" placeholder="Повторите">
      <button class="btn-save" style="margin-top:10px;" onclick="changeMasterPassword()">Сменить</button>
    </div>

    <div class="field" style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border);">
      <button class="btn-danger" onclick="exportData()">📤 Экспорт (JSON)</button>
      <button class="btn-danger" onclick="importData()">📥 Импорт (JSON)</button>
      <button class="btn-danger" onclick="wipeAll()">💣 Удалить все данные</button>
    </div>

    <div style="text-align:center; font-size:11px; color:var(--muted); margin-top:20px; line-height:1.6;">
      🔒 Шифрование AES-GCM 256-bit<br>
      Данные хранятся только в этом браузере
    </div>
  </div>
</div>

<!-- Тост -->
<div class="toast" id="toast"></div>

<script>
// ==================== КОНФИГ ====================
const STORAGE_KEY = 'pw_vault_pro';
const CHECK_KEY = 'pw_check';
const SALT_KEY = 'pw_salt';

const COLORS = ['#6366f1', '#8b5cf6', '#ec4899', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#3b82f6'];

// ==================== СОСТОЯНИЕ ====================
let state = {
  key: null,          // CryptoKey (производный от мастер-пароля)
  passwords: [],      // расшифрованный массив
  editingId: null,
  isFirstTime: false
};

// ==================== УТИЛИТЫ ====================
const $ = id => document.getElementById(id);

function showToast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2200);
}

function randomColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

// ==================== КРИПТОГРАФИЯ ====================
// Производный ключ из мастер-пароля через PBKDF2
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

// Шифрование строки → base64
async function encrypt(text, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, enc.encode(text)
  );
  const combined = new Uint8Array(iv.length + cipher.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipher), iv.length);
  return btoa(String.fromCharCode(...combined));
}

// Расшифровка base64 → строка
async function decrypt(base64, key) {
  const combined = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const iv = combined.slice(0, 12);
  const cipher = combined.slice(12);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
  return new TextDecoder().decode(plain);
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
async function init() {
  // Первый запуск? Проверяем наличие соли
  const existingSalt = localStorage.getItem(SALT_KEY);
  state.isFirstTime = !existingSalt;

  if (state.isFirstTime) {
    $('authTitle').textContent = 'Создать хранилище';
    $('authSub').textContent = 'Придумайте мастер-пароль (не менее 6 символов)';
    $('confirmField').style.display = 'block';
    $('authBtn').textContent = 'Создать';
    $('masterStrengthMeter').style.display = 'block';
  } else {
    $('authTitle').textContent = 'Пароли PRO';
    $('authSub').textContent = 'Введите мастер-пароль для входа';
    $('confirmField').style.display = 'none';
    $('authBtn').textContent = 'Войти';
    $('masterStrengthMeter').style.display = 'none';
  }
  
  // Проверка силы пароля при вводе
  $('masterInput').addEventListener('input', updateMasterStrength);
  
  // Enter для входа
  $('masterInput').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
  $('masterConfirm').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });
}

function updateMasterStrength() {
  const pw = $('masterInput').value;
  const strength = getStrength(pw);
  const fill = $('masterStrengthFill');
  fill.style.width = strength.score + '%';
  fill.style.background = strength.color;
}

function toggleMasterVisibility() {
  const inp = $('masterInput');
  const btn = $('eyeBtn');
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.textContent = '🙈';
  } else {
    inp.type = 'password';
    btn.textContent = '👁';
  }
}

// ==================== АВТОРИЗАЦИЯ ====================
async function handleAuth() {
  const pw = $('masterInput').value;
  const errEl = $('authError');
  errEl.textContent = '';
  
  if (!pw || pw.length < 6) {
    errEl.textContent = 'Пароль должен быть минимум 6 символов';
    return;
  }

  $('authBtn').disabled = true;
  $('authBtn').textContent = 'Проверка...';

  try {
    if (state.isFirstTime) {
      // Создание хранилища
      const confirm = $('masterConfirm').value;
      if (pw !== confirm) {
        errEl.textContent = 'Пароли не совпадают';
        return;
      }
      
      const salt = crypto.getRandomValues(new Uint8Array(16));
      localStorage.setItem(SALT_KEY, btoa(String.fromCharCode(...salt)));
      
      const key = await deriveKey(pw, salt);
      
      // Сохраняем проверочное значение для валидации входа
      const check = await encrypt('VALID', key);
      localStorage.setItem(CHECK_KEY, check);
      localStorage.setItem(STORAGE_KEY, await encrypt('[]', key));
      
      state.key = key;
      state.passwords = [];
      enterMain();
      showToast('✅ Хранилище создано');
      
    } else {
      // Вход
      const saltB64 = localStorage.getItem(SALT_KEY);
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      const key = await deriveKey(pw, salt);
      
      // Проверяем правильность пароля
      try {
        const check = await decrypt(localStorage.getItem(CHECK_KEY), key);
        if (check !== 'VALID') throw new Error('invalid');
      } catch {
        errEl.textContent = '❌ Неверный мастер-пароль';
        return;
      }
      
      // Расшифровываем данные
      const encrypted = localStorage.getItem(STORAGE_KEY);
      const json = await decrypt(encrypted, key);
      
      state.key = key;
      state.passwords = JSON.parse(json);
      enterMain();
      showToast('👋 С возвращением');
    }
  } catch (err) {
    errEl.textContent = '❌ Ошибка: ' + err.message;
  } finally {
    $('authBtn').disabled = false;
    $('authBtn').textContent = state.isFirstTime ? 'Создать' : 'Войти';
  }
}

function enterMain() {
  $('authScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  $('masterInput').value = '';
  $('masterConfirm').value = '';
  renderList();
}

// ==================== БЛОКИРОВКА ====================
function lockApp() {
  state.key = null;
  state.passwords = [];
  $('mainScreen').classList.add('hidden');
  $('authScreen').classList.remove('hidden');
  $('authError').textContent = '';
  $('masterInput').value = '';
  $('masterInput').focus();
  showToast('🔒 Заблокировано');
}

// ==================== СИЛА ПАРОЛЯ ====================
function getStrength(pw) {
  let score = 0;
  if (!pw) return { score: 0, color: '#64748b', label: 'Пусто' };
  
  if (pw.length >= 8) score += 25;
  if (pw.length >= 12) score += 20;
  if (pw.length >= 16) score += 15;
  if (/[a-z]/.test(pw)) score += 10;
  if (/[A-Z]/.test(pw)) score += 10;
  if (/[0-9]/.test(pw)) score += 10;
  if (/[^A-Za-z0-9]/.test(pw)) score += 10;
  
  score = Math.min(100, score);
  
  if (score < 40) return { score, color: '#ef4444', label: 'Слабый' };
  if (score < 70) return { score, color: '#f59e0b', label: 'Средний' };
  return { score, color: '#10b981', label: 'Надёжный' };
}

// ==================== РЕНДЕР СПИСКА ====================
let revealedPasswords = new Set();

function renderList() {
  const query = $('searchInput').value.toLowerCase().trim();
  let filtered = state.passwords;
  if (query) {
    filtered = filtered.filter(p => 
      p.name.toLowerCase().includes(query) || 
      p.login.toLowerCase().includes(query)
    );
  }
  
  // Сортировка по имени
  filtered = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
  
  // Статистика
  const total = state.passwords.length;
  const strong = state.passwords.filter(p => getStrength(p.password).score >= 70).length;
  const weak = state.passwords.filter(p => getStrength(p.password).score < 40).length;
  $('statTotal').textContent = total;
  $('statStrong').textContent = strong;
  $('statWeak').textContent = weak;
  
  // Список
  const list = $('list');
  
  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${query ? '🔍' : '📝'}</div>
        <div class="empty-title">${query ? 'Ничего не найдено' : 'Пока пусто'}</div>
        <div class="empty-sub">${query ? 'Попробуйте другой запрос' : 'Нажмите + чтобы добавить пароль'}</div>
      </div>`;
    return;
  }
  
  list.innerHTML = filtered.map(p => {
    const strength = getStrength(p.password);
    const color = randomColor(p.name);
    const initial = p.name.charAt(0).toUpperCase();
    const isRevealed = revealedPasswords.has(p.id);
    const displayPw = isRevealed ? p.password : '•'.repeat(Math.min(p.password.length, 20));
    
    return `
      <div class="pw-card" data-id="${p.id}">
        <div class="pw-top">
          <div class="pw-avatar" style="background:${color}30; color:${color};">${initial}</div>
          <div class="pw-info">
            <div class="pw-name">${escapeHtml(p.name)}</div>
            <div class="pw-login">${escapeHtml(p.login || '—')}</div>
          </div>
          <div class="pw-actions">
            <button class="pw-action" onclick="toggleReveal(${p.id})" title="Показать">${isRevealed ? '🙈' : '👁'}</button>
            <button class="pw-action" onclick="copyPassword(${p.id})" title="Копировать">📋</button>
            <button class="pw-action" onclick="openEditModal(${p.id})" title="Изменить">✏️</button>
          </div>
        </div>
        <div class="pw-password-row">
          <div class="pw-password ${isRevealed ? '' : 'masked'}">${escapeHtml(displayPw)}</div>
          <span class="pw-strength-badge" style="background:${strength.color}25; color:${strength.color};">${strength.label}</span>
        </div>
        ${p.note ? `<div style="font-size:12px; color:var(--muted); margin-top:10px;">📝 ${escapeHtml(p.note)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ==================== ДЕЙСТВИЯ ====================
function toggleReveal(id) {
  if (revealedPasswords.has(id)) revealedPasswords.delete(id);
  else revealedPasswords.add(id);
  renderList();
}

async function copyPassword(id) {
  const p = state.passwords.find(x => x.id === id);
  if (!p) return;
  try {
    await navigator.clipboard.writeText(p.password);
    showToast('📋 Скопировано');
  } catch {
    const tmp = document.createElement('textarea');
    tmp.value = p.password;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    showToast('📋 Скопировано');
  }
}

// ==================== РЕДАКТИРОВАНИЕ ====================
function openAddModal() {
  state.editingId = null;
  $('editModalTitle').textContent = 'Новый пароль';
  $('editName').value = '';
  $('editLogin').value = '';
  $('editPassword').value = '';
  $('editNote').value = '';
  $('deleteBtn').classList.add('hidden');
  $('editModal').classList.add('show');
  setTimeout(() => $('editName').focus(), 300);
}

function openEditModal(id) {
  const p = state.passwords.find(x => x.id === id);
  if (!p) return;
  state.editingId = id;
  $('editModalTitle').textContent = 'Редактировать';
  $('editName').value = p.name;
  $('editLogin').value = p.login || '';
  $('editPassword').value = p.password;
  $('editNote').value = p.note || '';
  $('deleteBtn').classList.remove('hidden');
  $('editModal').classList.add('show');
}

function closeEditModal() {
  $('editModal').classList.remove('show');
  state.editingId = null;
}

async function savePassword() {
  const name = $('editName').value.trim();
  const login = $('editLogin').value.trim();
  const password = $('editPassword').value;
  const note = $('editNote').value.trim();
  
  if (!name) {
    $('editName').style.borderColor = 'var(--red)';
    setTimeout(() => $('editName').style.borderColor = '', 1000);
    return;
  }
  if (!password) {
    $('editPassword').style.borderColor = 'var(--red)';
    setTimeout(() => $('editPassword').style.borderColor = '', 1000);
    return;
  }
  
  if (state.editingId) {
    const idx = state.passwords.findIndex(x => x.id === state.editingId);
    if (idx >= 0) {
      state.passwords[idx] = { ...state.passwords[idx], name, login, password, note };
    }
  } else {
    state.passwords.push({
      id: Date.now(),
      name, login, password, note,
      createdAt: Date.now()
    });
  }
  
  await persist();
  closeEditModal();
  renderList();
  showToast('✅ Сохранено');
}

async function deletePassword() {
  if (!state.editingId) return;
  if (!confirm('Удалить этот пароль?')) return;
  state.passwords = state.passwords.filter(x => x.id !== state.editingId);
  await persist();
  closeEditModal();
  renderList();
  showToast('🗑 Удалено');
}

// ==================== СОХРАНЕНИЕ ====================
async function persist() {
  if (!state.key) return;
  const json = JSON.stringify(state.passwords);
  const encrypted = await encrypt(json, state.key);
  localStorage.setItem(STORAGE_KEY, encrypted);
}

// ==================== ГЕНЕРАТОР ПАРОЛЕЙ ====================
const CHARS = {
  lower: 'abcdefghijkmnopqrstuvwxyz',
  upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
  digits: '23456789',
  symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

function secureRandom(max) {
  if (window.crypto && crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function generatePassword() {
  const length = parseInt($('genLength').value);
  const allChars = CHARS.lower + CHARS.upper + CHARS.digits + CHARS.symbols;
  
  let pw = '';
  // Гарантируем хотя бы по 1 символу каждого типа
  Object.values(CHARS).forEach(set => {
    pw += set[secureRandom(set.length)];
  });
  
  while (pw.length < length) {
    pw += allChars[secureRandom(allChars.length)];
  }
  
  // Перемешиваем
  const arr = pw.split('');
  for (let i = arr.length - 1; i > 0; i--) {
    const j = secureRandom(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  
  $('editPassword').value = arr.join('').slice(0, length);
  showToast('🎲 Сгенерировано');
}

// ==================== НАСТРОЙКИ ====================
function openSettings() {
  $('newMasterInput').value = '';
  $('newMasterConfirm').value = '';
  $('settingsModal').classList.add('show');
}

function closeSettings() {
  $('settingsModal').classList.remove('show');
}

async function changeMasterPassword() {
  const newPw = $('newMasterInput').value;
  const confirmPw = $('newMasterConfirm').value;
  
  if (newPw.length < 6) {
    showToast('Минимум 6 символов', true);
    return;
  }
  if (newPw !== confirmPw) {
    showToast('Пароли не совпадают', true);
    return;
  }
  
  try {
    // Новая соль и ключ
    const salt = crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem(SALT_KEY, btoa(String.fromCharCode(...salt)));
    
    const newKey = await deriveKey(newPw, salt);
    
    // Пересохраняем всё с новым ключом
    const check = await encrypt('VALID', newKey);
    localStorage.setItem(CHECK_KEY, check);
    
    state.key = newKey;
    await persist();
    
    closeSettings();
    showToast('✅ Пароль сменён');
  } catch (err) {
    showToast('❌ Ошибка: ' + err.message, true);
  }
}

// ==================== ЭКСПОРТ/ИМПОРТ ====================
async function exportData() {
  if (!confirm('Экспортировать все пароли в JSON? Файл будет содержать данные в открытом виде!')) return;
  
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    passwords: state.passwords
  };
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `passwords-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 Экспортировано');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      
      if (!data.passwords || !Array.isArray(data.passwords)) {
        throw new Error('Неверный формат файла');
      }
      
      if (!confirm(`Импортировать ${data.passwords.length} паролей? Текущие данные будут заменены.`)) return;
      
      state.passwords = data.passwords;
      await persist();
      renderList();
      closeSettings();
      showToast(`📥 Импортировано ${data.passwords.length}`);
    } catch (err) {
      showToast('❌ ' + err.message, true);
    }
  };
  input.click();
}

async function wipeAll() {
  if (!confirm('Удалить ВСЕ данные? Это действие необратимо!')) return;
  if (!confirm('Вы уверены? Все пароли будут потеряны.')) return;
  
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(CHECK_KEY);
  localStorage.removeItem(SALT_KEY);
  state.passwords = [];
  state.key = null;
  
  $('mainScreen').classList.add('hidden');
  $('authScreen').classList.remove('hidden');
  $('settingsModal').classList.remove('show');
  
  // Сбрасываем в режим первого запуска
  state.isFirstTime = true;
  $('authTitle').textContent = 'Создать хранилище';
  $('authSub').textContent = 'Придумайте мастер-пароль (не менее 6 символов)';
  $('confirmField').style.display = 'block';
  $('authBtn').textContent = 'Создать';
  $('masterStrengthMeter').style.display = 'block';
  
  showToast('💣 Все данные удалены');
}

// ==================== ЗАКРЫТИЕ МОДАЛОК ====================
$('editModal').addEventListener('click', e => {
  if (e.target === $('editModal')) closeEditModal();
});
$('settingsModal').addEventListener('click', e => {
  if (e.target === $('settingsModal')) closeSettings();
});

// Enter в модалке редактирования
document.addEventListener('keypress', e => {
  if (e.key === 'Enter' && $('editModal').classList.contains('show')) {
    if (e.target.tagName !== 'TEXTAREA') savePassword();
  }
});

// ==================== СТАРТ ====================
init();
</script>
