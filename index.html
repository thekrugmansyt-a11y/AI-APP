<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Пароли PRO v3</title>
<style>
  :root {
    --bg-1: #0a0e1a;
    --bg-2: #12182b;
    --card: rgba(30, 41, 59, 0.6);
    --card-solid: #1e293b;
    --border: rgba(148, 163, 184, 0.12);
    --text: #f1f5f9;
    --dim: #94a3b8;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --shadow: rgba(0,0,0,0.4);
    --qr-bg: #ffffff;
  }

  body.light {
    --bg-1: #f8fafc;
    --bg-2: #e2e8f0;
    --card: rgba(255, 255, 255, 0.7);
    --card-solid: #ffffff;
    --border: rgba(15, 23, 42, 0.1);
    --text: #0f172a;
    --dim: #64748b;
    --muted: #94a3b8;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --shadow: rgba(15, 23, 42, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height: 100vh; color: var(--text); padding: 16px;
    overflow-x: hidden; position: relative;
    transition: background 0.4s, color 0.4s;
  }

  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.22;
    z-index: -1; pointer-events: none; transition: background 0.4s;
  }
  body::before { width: 350px; height: 350px; background: var(--accent); top: -120px; right: -120px; }
  body::after { width: 300px; height: 300px; background: var(--accent-2); bottom: -100px; left: -100px; }

  .app { max-width: 500px; margin: 0 auto; }
  .hidden { display: none !important; }

  /* ЭКРАН ВХОДА */
  .auth-screen { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .auth-logo { text-align: center; font-size: 64px; margin-bottom: 12px; }
  .auth-title { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 6px; }
  .auth-sub { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 32px; }
  .auth-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 28px; box-shadow: 0 20px 50px var(--shadow); }
  
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
  .input-wrap { position: relative; }
  .input-wrap .input { padding-right: 48px; }
  .input { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.1); border: 1.5px solid transparent; border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: all 0.25s; font-family: inherit; }
  body.light .input { background: rgba(0,0,0,0.03); }
  .input:focus { border-color: var(--accent); background: rgba(99, 102, 241, 0.05); }
  .input::placeholder { color: var(--muted); }
  .eye-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; background: transparent; border: none; color: var(--dim); font-size: 16px; cursor: pointer; }
  
  .btn-primary { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35); }
  .auth-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }

  /* ОСНОВНОЙ ЭКРАН */
  .main-screen { animation: fadeIn 0.4s ease; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .logo { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; }
  .icon-btn:hover { background: var(--accent); color: #fff; }
  .icon-btn.panic:hover { background: var(--red); }

  .search-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-wrap { flex: 1; position: relative; }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: 0.5; }
  #searchInput { width: 100%; padding: 13px 16px 13px 44px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 15px; outline: none; }
  .add-btn { padding: 0 20px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--dim); text-transform: uppercase; font-weight: 600; }

  /* СПИСОК */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .pw-card { background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .pw-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .pw-avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; overflow: hidden; background: rgba(0,0,0,0.1); }
  body.light .pw-avatar { background: rgba(0,0,0,0.05); }
  .pw-avatar img { width: 100%; height: 100%; object-fit: contain; padding: 8px; background: #fff; }
  .pw-info { flex: 1; min-width: 0; }
  .pw-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pw-login { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pw-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .pw-action { width: 34px; height: 34px; border-radius: 10px; background: rgba(0,0,0,0.1); border: none; color: var(--dim); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  body.light .pw-action { background: rgba(0,0,0,0.04); }
  .pw-action:hover { background: rgba(99, 102, 241, 0.2); color: var(--accent); }
  .pw-password-row { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.15); border-radius: 10px; padding: 10px 12px; }
  body.light .pw-password-row { background: rgba(0,0,0,0.04); }
  .pw-password { flex: 1; font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 1px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pw-strength-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }

  /* МОДАЛКИ */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--card-solid); border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); border-bottom: none; animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 20px; font-weight: 800; }
  .modal-close { width: 36px; height: 36px; border-radius: 10px; background: rgba(0,0,0,0.05); border: none; color: var(--text); font-size: 18px; cursor: pointer; }

  /* ГЕНЕРАТОР */
  .gen-row { display: flex; gap: 6px; align-items: center; }
  .gen-btn { padding: 14px 16px; border: none; border-radius: 12px; background: rgba(99, 102, 241, 0.15); color: var(--accent); font-size: 16px; cursor: pointer; }
  .gen-settings { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .gen-chip { padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,0.05); border: 1px solid transparent; font-size: 12px; font-weight: 600; color: var(--dim); cursor: pointer; transition: 0.2s; }
  .gen-chip.active { background: rgba(99, 102, 241, 0.15); border-color: var(--accent); color: var(--accent); }
  input[type="range"] { width: 100%; margin-top: 8px; -webkit-appearance: none; height: 5px; background: rgba(0,0,0,0.1); border-radius: 3px; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer; }
  
  .btn-save { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; }
  .btn-danger { width: 100%; padding: 13px; border: 1.5px solid rgba(239, 68, 68, 0.3); border-radius: 12px; background: rgba(239, 68, 68, 0.1); color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }

  /* ИСТОРИЯ */
  .history-section { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); display: none; }
  .history-section.show { display: block; }
  .history-title { font-size: 12px; color: var(--dim); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; }
  .history-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.05); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-family: 'Courier New', monospace; font-size: 13px; }
  .history-item button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; }

  /* АУДИТ */
  .audit-section { margin-bottom: 20px; }
  .audit-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .audit-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.05); margin-bottom: 6px; font-size: 13px; }
  .audit-item button { background: var(--accent); color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; }

  /* QR */
  .qr-container { text-align: center; padding: 20px 0; }
  #qrCanvas { background: var(--qr-bg); padding: 10px; border-radius: 12px; max-width: 100%; height: auto; }

  /* ТОСТ */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--green); color: #fff; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: all 0.3s; z-index: 200; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: var(--red); }
</style>
<!-- Подключаем библиотеку для QR-кодов -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<body>
<div class="app">
  <!-- ЭКРАН ВХОДА -->

<!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
<div class="modal-overlay" id="editModal">

<script>
// ==================== КОНФИГ ====================
const STORAGE_KEY = 'pw_vault_pro';
const CHECK_KEY = 'pw_check';
const SALT_KEY = 'pw_salt';
const COLORS = ['#6366f1', '#8b5cf6', '#ec4899', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#3b82f6'];
const DICEWARE_WORDS = ['apple', 'brave', 'crane', 'delta', 'eagle', 'flame', 'ghost', 'hotel', 'ivory', 'joker', 'knife', 'lemon', 'mango', 'noble', 'ocean', 'pilot', 'queen', 'robot', 'solar', 'tiger', 'unity', 'vivid', 'whale', 'xenon', 'yacht', 'zebra', 'amber', 'blaze', 'crisp', 'dream'];

// ==================== СОСТОЯНИЕ ====================
let state = {
  key: null, passwords: [], editingId: null, isFirstTime: false, revealed: new Set(), genMode: 'chars'
};

// ==================== УТИЛИТЫ ====================
const $ = id => document.getElementById(id);
function showToast(msg, isError = false) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.className = 'toast', 2500);
}
function randomColor(str) {
  let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return COLORS[Math.abs(hash) % COLORS.length];
}

// ==================== КРИПТОГРАФИЯ ====================
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptData(text, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
  const combined = new Uint8Array(iv.length + cipher.byteLength);
  combined.set(iv, 0); combined.set(new Uint8Array(cipher), iv.length);
  return btoa(String.fromCharCode(...combined));
}
async function decryptData(base64, key) {
  const combined = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: combined.slice(0, 12) }, key, combined.slice(12));
  return new TextDecoder().decode(plain);
}

// ==================== ИНИЦИАЛИЗАЦИЯ И ВХОД ====================
function init() {
  initTheme();
  state.isFirstTime = !localStorage.getItem(SALT_KEY);
  $('authTitle').textContent = state.isFirstTime ? 'Создать хранилище' : 'Пароли PRO';
  $('authSub').textContent = state.isFirstTime ? 'Придумайте мастер-пароль' : 'Введите мастер-пароль';
  $('confirmField').style.display = state.isFirstTime ? 'block' : 'none';
  $('authBtn').textContent = state.isFirstTime ? 'Создать' : 'Войти';
}

async function handleAuth() {
  const pw = $('masterInput').value;
  const errEl = $('authError');
  errEl.textContent = '';
  if (!pw || pw.length < 6) return errEl.textContent = 'Минимум 6 символов';
  $('authBtn').disabled = true;
  
  try {
    if (state.isFirstTime) {
      if (pw !== $('masterConfirm').value) return errEl.textContent = 'Пароли не совпадают';
      const salt = crypto.getRandomValues(new Uint8Array(16));
      localStorage.setItem(SALT_KEY, btoa(String.fromCharCode(...salt)));
      const key = await deriveKey(pw, salt);
      localStorage.setItem(CHECK_KEY, await encryptData('VALID', key));
      localStorage.setItem(STORAGE_KEY, await encryptData('[]', key));
      state.key = key; state.passwords = [];
      enterMain(); showToast('✅ Хранилище создано');
    } else {
      const salt = Uint8Array.from(atob(localStorage.getItem(SALT_KEY)), c => c.charCodeAt(0));
      const key = await deriveKey(pw, salt);
      try {
        const check = await decryptData(localStorage.getItem(CHECK_KEY), key);
        if (check !== 'VALID') throw new Error();
      } catch { return errEl.textContent = '❌ Неверный пароль'; }
      state.key = key;
      state.passwords = JSON.parse(await decryptData(localStorage.getItem(STORAGE_KEY), key));
      enterMain(); showToast('👋 С возвращением');
    }
  } catch (err) { errEl.textContent = '❌ Ошибка: ' + err.message; }
  finally { $('authBtn').disabled = false; }
}

function enterMain() {
  $('authScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  $('masterInput').value = ''; $('masterConfirm').value = '';
  renderList();
}

function lockApp() {
  state.key = null; state.passwords = []; state.revealed.clear();
  $('mainScreen').classList.add('hidden');
  $('authScreen').classList.remove('hidden');
  $('authError').textContent = ''; $('masterInput').value = '';
  showToast('🔒 Заблокировано');
}

function panicMode() {
  lockApp();
  $('searchInput').value = '';
  $('masterInput').value = '';
  $('masterInput').type = 'password';
  $('eyeBtn').textContent = '👁';
  showToast('💣 Паника: экран очищен');
}

// ==================== РЕНДЕР СПИСКА ====================
function getStrength(pw) {
  if (!pw) return { score: 0, color: '#64748b', label: 'Пусто' };
  let score = 0;
  if (pw.length >= 8) score += 25;
  if (pw.length >= 12) score += 20;
  if (pw.length >= 16) score += 15;
  if (/[a-z]/.test(pw)) score += 10;
  if (/[A-Z]/.test(pw)) score += 10;
  if (/[0-9]/.test(pw)) score += 10;
  if (/[^A-Za-z0-9]/.test(pw)) score += 10;
  score = Math.min(100, score);
  if (score < 40) return { score, color: '#ef4444', label: 'Слабый' };
  if (score < 70) return { score, color: '#f59e0b', label: 'Средний' };
  return { score, color: '#10b981', label: 'Надёжный' };
}

function renderList() {
  const query = $('searchInput').value.toLowerCase().trim();
  let filtered = state.passwords;
  if (query) filtered = filtered.filter(p => p.name.toLowerCase().includes(query) || (p.login && p.login.toLowerCase().includes(query)));
  filtered.sort((a, b) => a.name.localeCompare(b.name));

  $('statTotal').textContent = state.passwords.length;
  $('statStrong').textContent = state.passwords.filter(p => getStrength(p.password).score >= 70).length;
  $('statWeak').textContent = state.passwords.filter(p => getStrength(p.password).score < 40).length;

  const list = $('list');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">${query ? '🔍' : '📝'}</div><div>${query ? 'Ничего не найдено' : 'Добавьте первый пароль'}</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const str = getStrength(p.password);
    const isRev = state.revealed.has(p.id);
    const displayPw = isRev ? p.password : '•'.repeat(Math.min(p.password.length, 20));
    const domain = p.name.replace(/^https?:\/\//, '').split('/')[0].trim();
    const color = randomColor(p.name);
    const iconHTML = domain.includes('.') 
      ? `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" onerror="this.outerHTML='<span style=\\'color:${color};\\'>${p.name.charAt(0).toUpperCase()}</span>'">`
      : `<span style="color:${color};">${p.name.charAt(0).toUpperCase()}</span>`;

    return `
      <div class="pw-card">
        <div class="pw-top">
          <div class="pw-avatar" style="background:${color}20; border:1px solid ${color}30;">${iconHTML}</div>
          <div class="pw-info">
            <div class="pw-name">${escapeHtml(p.name)}</div>
            <div class="pw-login">${escapeHtml(p.login || '—')}</div>
          </div>
          <div class="pw-actions">
            <button class="pw-action" onclick="toggleReveal(${p.id})">${isRev ? '🙈' : '👁'}</button>
            <button class="pw-action" onclick="copyPassword(${p.id})">📋</button>
            <button class="pw-action" onclick="openEditModal(${p.id})">✏️</button>
          </div>
        </div>
        <div class="pw-password-row">
          <div class="pw-password ${isRev ? '' : 'masked'}">${escapeHtml(displayPw)}</div>
          <span class="pw-strength-badge" style="background:${str.color}20; color:${str.color};">${str.label}</span>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function toggleReveal(id) { if (state.revealed.has(id)) state.revealed.delete(id); else state.revealed.add(id); renderList(); }

async function copyPassword(id) {
  const p = state.passwords.find(x => x.id === id);
  if (!p) return;
  try { await navigator.clipboard.writeText(p.password); showToast('📋 Скопировано'); }
  catch {
    const tmp = document.createElement('textarea'); tmp.value = p.password;
    document.body.appendChild(tmp); tmp.select(); document.execCommand('copy');
    document.body.removeChild(tmp); showToast('📋 Скопировано');
  }
}

// ==================== ГЕНЕРАТОР ====================
function toggleGenSet(el) { el.classList.toggle('active'); }
function setGenMode(mode) {
  state.genMode = mode;
  $('modeChars').classList.toggle('active', mode === 'chars');
  $('modeWords').classList.toggle('active', mode === 'words');
  $('charSettings').style.display = mode === 'chars' ? 'block' : 'none';
}

function generatePassword() {
  if (state.genMode === 'words') {
    const count = Math.max(3, Math.floor(parseInt($('genLength').value) / 5));
    let words = [];
    for (let i = 0; i < count; i++) words.push(DICEWARE_WORDS[secureRandom(DICEWARE_WORDS.length)]);
    // Делаем первую букву заглавной, добавляем цифру и спецсимвол
    words[0] = words[0].charAt(0).toUpperCase() + words[0].slice(1);
    const pw = words.join('-') + secureRandom(10) + '!';
    $('editPassword').value = pw;
    showToast('🎲 Фраза сгенерирована');
    return;
  }

  const length = parseInt($('genLength').value);
  const activeSets = Array.from(document.querySelectorAll('#charSettings .gen-chip.active')).map(c => c.dataset.set);
  if (activeSets.length === 0) return showToast('Выберите типы символов!', true);

  const sets = {
    lower: 'abcdefghijkmnopqrstuvwxyz', upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
    digits: '23456789', symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };
  let pool = '', guarantee = [];
  
  activeSets.forEach(set => {
    if (set !== 'nosimilar' && sets[set]) { pool += sets[set]; guarantee.push(sets[set]); }
  });

  let pw = '';
  guarantee.forEach(set => { if (set.length) pw += set[secureRandom(set.length)]; });
  while (pw.length < length) pw += pool[secureRandom(pool.length)];
  if (activeSets.includes('nosimilar')) pw = pw.split('').filter(c => !['O', '0', 'l', '1', 'I'].includes(c)).join('');
  while (pw.length < length) pw += pool[secureRandom(pool.length)];

  const arr = pw.split('');
  for (let i = arr.length - 1; i > 0; i--) { const j = secureRandom(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  $('editPassword').value = arr.join('').slice(0, length);
  showToast('🎲 Сгенерировано');
}

function secureRandom(max) {
  if (window.crypto && crypto.getRandomValues) { const arr = new Uint32Array(1); crypto.getRandomValues(arr); return arr[0] % max; }
  return Math.floor(Math.random() * max);
}

// ==================== РЕДАКТИРОВАНИЕ ====================
function openAddModal() {
  state.editingId = null;
  $('editModalTitle').textContent = 'Новый пароль';
  $('editName').value = ''; $('editLogin').value = ''; $('editPassword').value = ''; $('editNote').value = '';
  $('historySection').classList.remove('show');
  $('deleteBtn').classList.add('hidden');
  $('qrBtn').classList.add('hidden');
  $('editModal').classList.add('show');
}

function openEditModal(id) {
  const p = state.passwords.find(x => x.id === id);
  if (!p) return;
  state.editingId = id;
  $('editModalTitle').textContent = 'Редактировать';
  $('editName').value = p.name; $('editLogin').value = p.login || '';
  $('editPassword').value = p.password; $('editNote').value = p.note || '';
  $('deleteBtn').classList.remove('hidden');
  $('qrBtn').classList.remove('hidden');

  const histList = $('historyList');
  if (p.history && p.history.length > 0) {
    $('historySection').classList.add('show');
    histList.innerHTML = p.history.map(h => `
      <div class="history-item">
        <span>${escapeHtml(h.password)}</span>
        <span style="font-size:10px; color:var(--muted); margin-left:10px;">${new Date(h.date).toLocaleDateString()}</span>
        <button onclick="copyHist('${h.password.replace(/'/g, "\\'")}')">📋</button>
      </div>
    `).join('');
  } else { $('historySection').classList.remove('show'); }
  $('editModal').classList.add('show');
}

function copyHist(pw) { navigator.clipboard.writeText(pw).then(() => showToast('📋 Скопировано')); }
function closeEditModal() { $('editModal').classList.remove('show'); state.editingId = null; }

async function savePassword() {
  const name = $('editName').value.trim();
  const login = $('editLogin').value.trim();
  const password = $('editPassword').value;
  const note = $('editNote').value.trim();
  if (!name || !password) return showToast('Заполните название и пароль', true);

  if (state.editingId) {
    const idx = state.passwords.findIndex(x => x.id === state.editingId);
    if (idx >= 0) {
      const old = state.passwords[idx];
      const history = old.history || [];
      if (old.password !== password) {
        history.unshift({ password: old.password, date: Date.now() });
        if (history.length > 5) history.pop();
      }
      state.passwords[idx] = { ...old, name, login, password, note, history, updatedAt: Date.now() };
    }
  } else {
    state.passwords.push({ id: Date.now(), name, login, password, note, history: [], createdAt: Date.now(), updatedAt: Date.now() });
  }
  await persist(); closeEditModal(); renderList(); showToast('✅ Сохранено');
}

async function deletePassword() {
  if (!state.editingId || !confirm('Удалить этот пароль?')) return;
  state.passwords = state.passwords.filter(x => x.id !== state.editingId);
  await persist(); closeEditModal(); renderList(); showToast('🗑 Удалено');
}

async function persist() {
  if (!state.key) return;
  localStorage.setItem(STORAGE_KEY, await encryptData(JSON.stringify(state.passwords), state.key));
}

// ==================== QR-КОД ====================
function openQRCode() {
  const p = state.passwords.find(x => x.id === state.editingId);
  if (!p) return;
  
  const qrData = JSON.stringify({ n: p.name, l: p.login, p: p.password, m: p.note });
  
  $('qrModal').classList.add('show');
  const canvas = $('qrCanvas');
  
  QRCode.toCanvas(canvas, qrData, { width: 250, margin: 1, color: { dark: '#0f172a', light: '#ffffff' } }, function (error) {
    if (error) showToast('Ошибка генерации QR', true);
  });
}
function closeQRCode() { $('qrModal').classList.remove('show'); }

// ==================== АУДИТ ====================
function openAuditModal() {
  const content = $('auditContent');
  if (state.passwords.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🛡</div><div>Нет данных для аудита</div></div>`;
  } else {
    let weak = [], reused = {}, old = [];
    const now = Date.now();
    const yearMs = 365 * 24 * 60 * 60 * 1000;

    state.passwords.forEach(p => {
      const str = getStrength(p.password);
      if (str.score < 40) weak.push(p);
      
      if (!reused[p.password]) reused[p.password] = [];
      reused[p.password].push(p);
      
      if (p.updatedAt && (now - p.updatedAt) > yearMs) old.push(p);
    });

    const reusedList = Object.values(reused).filter(arr => arr.length > 1);
    let html = '';

    if (weak.length > 0) {
      html += `<div class="audit-section"><div class="audit-title" style="color:var(--red);">🔴 Слабые пароли (${weak.length})</div>`;
      weak.forEach(p => {
        html += `<div class="audit-item"><span>${escapeHtml(p.name)}</span><button onclick="editFromAudit(${p.id})">Исправить</button></div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="audit-section"><div class="audit-title" style="color:var(--green);">🟢 Слабых паролей нет</div></div>`;
    }

    if (reusedList.length > 0) {
      html += `<div class="audit-section"><div class="audit-title" style="color:var(--yellow);">🟡 Повторяющиеся пароли (${reusedList.length} шт)</div>`;
      reusedList.forEach(arr => {
        html += `<div class="audit-item" style="flex-direction:column; align-items:flex-start; gap:5px;">`;
        html += `<span style="font-family:monospace; color:var(--yellow);">${'*'.repeat(arr[0].password.length)}</span>`;
        html += `<div style="font-size:11px; color:var(--dim);">${arr.map(p => p.name).join(', ')}</div>`;
        html += `</div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="audit-section"><div class="audit-title" style="color:var(--green);">🟢 Повторяющихся паролей нет</div></div>`;
    }

    if (old.length > 0) {
      html += `<div class="audit-section"><div class="audit-title" style="color:var(--yellow);">🟡 Старые пароли > 1 года (${old.length})</div>`;
      old.forEach(p => {
        html += `<div class="audit-item"><span>${escapeHtml(p.name)}</span><button onclick="editFromAudit(${p.id})">Обновить</button></div>`;
      });
      html += `</div>`;
    }

    content.innerHTML = html;
  }
  $('auditModal').classList.add('show');
}

function editFromAudit(id) { closeAuditModal(); openEditModal(id); }
function closeAuditModal() { $('auditModal').classList.remove('show'); }

// ==================== НАСТРОЙКИ ====================
function openSettings() { $('newMasterInput').value = ''; $('newMasterConfirm').value = ''; $('settingsModal').classList.add('show'); }
function closeSettings() { $('settingsModal').classList.remove('show'); }

async function changeMasterPassword() {
  const newPw = $('newMasterInput').value;
  if (newPw.length < 6) return showToast('Минимум 6 символов', true);
  if (newPw !== $('newMasterConfirm').value) return showToast('Пароли не совпадают', true);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  localStorage.setItem(SALT_KEY, btoa(String.fromCharCode(...salt)));
  const newKey = await deriveKey(newPw, salt);
  localStorage.setItem(CHECK_KEY, await encryptData('VALID', newKey));
  state.key = newKey;
  await persist();
  closeSettings(); showToast('✅ Пароль сменён');
}

// ==================== ЭКСПОРТ / ИМПОРТ ====================
async function exportEncrypted() {
  const pw = prompt('Придумайте пароль для файла:');
  if (!pw || pw.length < 4) return showToast('Пароль слишком короткий', true);
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(pw, salt);
    const encrypted = await encryptData(JSON.stringify(state.passwords), key);
    const exportObj = { app: 'PasswordsPRO', version: 3, salt: btoa(String.fromCharCode(...salt)), data: encrypted };
    const blob = new Blob([JSON.stringify(exportObj)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click(); URL.revokeObjectURL(url);
    showToast('📤 Экспортировано');
  } catch (e) { showToast('Ошибка', true); }
}

function importEncrypted() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      if (obj.app !== 'PasswordsPRO') throw new Error();
      const pw = prompt('Введите пароль от файла:');
      if (!pw) return;
      const salt = Uint8Array.from(atob(obj.salt), c => c.charCodeAt(0));
      const key = await deriveKey(pw, salt);
      const decrypted = await decryptData(obj.data, key);
      const imported = JSON.parse(decrypted);
      if (!Array.isArray(imported)) throw new Error();
      if (!confirm(`Импортировать ${imported.length} записей?`)) return;
      state.passwords = imported; await persist(); renderList(); closeSettings();
      showToast('📥 Импортировано');
    } catch (err) { showToast('❌ Неверный пароль или файл', true); }
  };
  input.click();
}

async function wipeAll() {
  if (!confirm('Удалить ВСЕ данные?')) return;
  if (!confirm('Вы уверены?')) return;
  localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(CHECK_KEY); localStorage.removeItem(SALT_KEY);
  location.reload();
}

['editModal', 'settingsModal', 'auditModal', 'qrModal'].forEach(id => {
  $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).classList.remove('show'); });
});
$('masterInput').addEventListener('keypress', e => { if (e.key === 'Enter') handleAuth(); });

init();
