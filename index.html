<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skipper VPN - Баннер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    background: #02050a;
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    overflow: hidden;
    background: radial-gradient(circle at center, #0a1b3a 0%, #02050a 100%);
  }
  
  /* Контейнер для баннера */
  .scene {
    width: 95vw; 
    max-width: 1000px; 
    aspect-ratio: 16 / 9; 
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    
    /* Тень вокруг баннера */
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), 
                0 15px 40px rgba(0,0,0,0.8);
    
    /* Анимация: Появление -> Стоит -> Исчезновение (6 секунд, цикл) */
    animation: fadeCycle 6s ease-in-out infinite;
    opacity: 0;
  }

  /* Сама картинка */
  .banner-bg {
    width: 100%; 
    height: 100%;
    
    /* ВАША КАРТИНКА */
    background: url('banner.jpg') center/cover no-repeat;
    
    /* Делаем картинку максимально четкой */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }

  /* Легкая виньетка для красоты */
  .vignette {
    position: absolute; 
    inset: 0;
    background: radial-gradient(circle at center, transparent 50%, rgba(0, 5, 15, 0.6) 100%);
    pointer-events: none;
  }

  /* --- АНИМАЦИЯ ЦИКЛА --- */
  @keyframes fadeCycle {
    0% { 
      opacity: 0; 
      transform: scale(0.98); 
    }
    25% { 
      opacity: 1; 
      transform: scale(1); 
    }
    75% { 
      opacity: 1; 
      transform: scale(1); 
    }
    100% { 
      opacity: 0; 
      transform: scale(0.98); 
    }
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="banner-bg"></div>
    <div class="vignette"></div>
  </div>

</body>
</html>
