<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI Assistant Lite</title>
<style>
  /* ==========================================
     СБРОС СТИЛЕЙ И ПЕРЕМЕННЫЕ
     ========================================== */
  :root {
    --bg-main: #0d0d0d;
    --bg-panel: #171717;
    --bg-input: #212121;
    --bg-msg-user: #2563eb;
    --bg-msg-bot: #171717;
    --text-main: #ececec;
    --text-muted: #8e8e8e;
    --border-color: #2a2a2a;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-family);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ==========================================
     ВЕРХНЯЯ ПАНЕЛЬ (HEADER)
     ========================================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    height: 56px;
    position: relative;
    z-index: 10;
  }

  .header-title {
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--danger);
    transition: background-color 0.3s;
  }
  .header-title .dot.ready { background-color: #22c55e; }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--bg-input); color: var(--text-main); }
  .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* ==========================================
     ОБЛАСТЬ ЧАТА
     ========================================== */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    height: calc(100vh - 56px - 70px);
    scroll-behavior: smooth;
  }

  /* Стили скроллбара */
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .chat-area::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Сообщения */
  .message-row {
    display: flex;
    gap: 12px;
    max-width: 100%;
    animation: fadeIn 0.3s ease-out forwards;
  }
  .message-row.user { flex-direction: row-reverse; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .avatar.bot { background: #1e293b; color: #60a5fa; border: 1px solid #334155; }
  .avatar.user { background: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }

  .message-content {
    padding: 12px 16px;
    border-radius: 12px;
    max-width: 85%;
    word-wrap: break-word;
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.6;
  }
  .message-row.user .message-content {
    background: var(--bg-msg-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message-row.bot .message-content {
    background: var(--bg-msg-bot);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-bottom-left-radius: 4px;
  }

  /* Индикатор печати */
  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 8px;
  }
  .typing-indicator span {
    width: 6px;
    height: 6px;
    background-color: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* Системные сообщения */
  .system-msg {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    align-self: center;
    max-width: 90%;
  }

  /* ==========================================
     НИЖНЯЯ ПАНЕЛЬ ВВОДА
     ========================================== */
  .input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-main);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border-color);
    z-index: 10;
  }

  .input-wrapper {
    display: flex;
    align-items: flex-end;
    background: var(--bg-input);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    border: 1px solid var(--border-color);
    transition: border-color 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-main);
    font-family: var(--font-family);
    font-size: 16px;
    resize: none;
    max-height: 120px;
    min-height: 24px;
    padding: 8px 0;
    outline: none;
    line-height: 1.4;
  }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 8px;
    margin-bottom: 2px;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* ==========================================
     МОДАЛЬНОЕ ОКНО НАСТРОЕК
     ========================================== */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  
  .modal {
    background: var(--bg-panel);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 400px;
    border: 1px solid var(--border-color);
    animation: scaleIn 0.2s ease-out;
  }
  @keyframes scaleIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .modal .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .modal input[type="range"] { width: 120px; accent-color: var(--accent); }
  .modal .close-modal-btn {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    border: none;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .modal .close-modal-btn:hover { background: var(--accent-hover); }

  /* Загрузочный экран */
  .loader-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    transition: opacity 0.5s;
  }
  .loader-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { color: var(--text-muted); font-size: 14px; text-align: center; padding: 0 20px; }
  .progress-bar-container {
    width: 200px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-top: 15px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>

<!-- Экран загрузки -->
<div class="loader-overlay" id="loaderOverlay">
  <div class="spinner"></div>
  <div class="loader-text" id="loaderText">Инициализация нейросети (Qwen 0.5B)...</div>
  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<!-- Шапка -->
<div class="header">
  <div class="header-title">
    <span class="dot" id="statusDot"></span>
    AI Assistant Lite
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openSettings()" title="Настройки">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
    <button class="icon-btn" onclick="clearChat()" title="Очистить чат">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>
</div>

<!-- Область чата -->
<div class="chat-area" id="chatArea">
  <!-- Сообщения будут добавляться сюда -->
</div>

<!-- Панель ввода -->
<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="Напиши сообщение..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- Модальное окно настроек -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Настройки</h3>
    <div class="setting-row">
      <span>Креативность (Temp)</span>
      <input type="range" id="tempRange" min="0.1" max="1.5" step="0.1" value="0.7">
    </div>
    <div class="setting-row">
      <span>Макс. длина ответа</span>
      <input type="range" id="tokensRange" min="100" max="1000" step="50" value="500">
    </div>
    <button class="close-modal-btn" onclick="closeSettings()">Сохранить и закрыть</button>
  </div>
</div>

<!-- Импорт библиотеки WebLLM -->
<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

// ==========================================
// КОНФИГУРАЦИЯ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ==========================================
const CONFIG = {
  // ЛЕГКАЯ МОДЕЛЬ (около 350 МБ)
  modelId: "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
  systemPrompt: "Ты полезный и дружелюбный AI-ассистент. Отвечай на русском языке кратко и по делу.",
  temperature: 0.7,
  maxTokens: 500,
};

let engine = null;
let chatHistory = [];
let isGenerating = false;
let loadingTimeout = null;

// DOM-элементы
const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const loaderOverlay = document.getElementById('loaderOverlay');
const loaderText = document.getElementById('loaderText');
const progressBar = document.getElementById('progressBar');
const statusDot = document.getElementById('statusDot');

// ==========================================
// ИНИЦИАЛИЗАЦИЯ НЕЙРОСЕТИ
// ==========================================
async function initAI() {
  try {
    // Проверка поддержки WebGPU
    if (!navigator.gpu) {
      throw new Error("Ваш браузер не поддерживает WebGPU. Откройте в Chrome 113+ или Edge.");
    }

    loaderText.textContent = "Загрузка модели Qwen (около 350 МБ)...";
    
    // Таймаут: если за 40 секунд ничего не произошло — выдаем ошибку
    loadingTimeout = setTimeout(() => {
      if (!engine) {
        loaderOverlay.querySelector('.spinner').style.display = 'none';
        loaderText.innerHTML = "<span style='color:#ef4444'>❌ Загрузка зависла.</span><br>Возможно, телефон не поддерживает WebGPU или не хватает памяти.";
      }
    }, 40000);

    engine = await webllm.CreateMLCEngine(CONFIG.modelId, {
      initProgressCallback: (report) => {
        const progress = report.progress || 0;
        progressBar.style.width = `${progress * 100}%`;
        if (report.text) {
          loaderText.textContent = report.text;
        }
      }
    });

    clearTimeout(loadingTimeout);

    // Успешная загрузка
    loaderOverlay.classList.add('hidden');
    statusDot.classList.add('ready');
    sendBtn.disabled = false;
    userInput.focus();
    
    addMessage("Привет! Я твой AI-ассистент. Чем могу помочь?", 'bot');

  } catch (error) {
    clearTimeout(loadingTimeout);
    console.error("Ошибка инициализации:", error);
    loaderOverlay.querySelector('.spinner').style.display = 'none';
    loaderText.innerHTML = `<span style="color: #ef4444;">❌ Ошибка:</span><br>${error.message}`;
  }
}

// ==========================================
// УПРАВЛЕНИЕ ЧАТОМ
// ==========================================
function addMessage(text, sender, isStreaming = false) {
  const row = document.createElement('div');
  row.className = `message-row ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${sender}`;
  avatar.textContent = sender === 'user' ? '👤' : '🤖';

  const content = document.createElement('div');
  content.className = 'message-content';
  
  if (isStreaming) {
    content.innerHTML = `
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;
  } else {
    content.textContent = text;
  }

  row.appendChild(avatar);
  row.appendChild(content);
  chatArea.appendChild(row);
  
  scrollToBottom();
  return content;
}

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addSystemMessage(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  chatArea.appendChild(div);
  scrollToBottom();
}

// ==========================================
// ОТПРАВКА СООБЩЕНИЯ И ГЕНЕРАЦИЯ
// ==========================================
async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isGenerating || !engine) return;

  addMessage(text, 'user');
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  isGenerating = true;

  chatHistory.push({ role: "user", content: text });

  const botContentDiv = addMessage("", 'bot', true);

  try {
    const chunks = await engine.chat.completions.create({
      messages: [
        { role: "system", content: CONFIG.systemPrompt },
        ...chatHistory
      ],
      temperature: parseFloat(document.getElementById('tempRange').value),
      max_tokens: parseInt(document.getElementById('tokensRange').value),
      stream: true,
    });

    let fullResponse = "";
    botContentDiv.textContent = "";

    for await (const chunk of chunks) {
      const delta = chunk.choices[0]?.delta?.content || "";
      fullResponse += delta;
      botContentDiv.textContent = fullResponse;
      scrollToBottom();
    }

    chatHistory.push({ role: "assistant", content: fullResponse });

  } catch (error) {
    botContentDiv.textContent = "❌ Ошибка генерации: " + error.message;
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

// ==========================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И СОБЫТИЯ
// ==========================================
function clearChat() {
  if (!confirm("Очистить историю чата?")) return;
  chatHistory = [];
  chatArea.innerHTML = '';
  addSystemMessage("История чата очищена.");
}

function openSettings() {
  document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('active');
}

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// Старт приложения
initAI();
</script>
</body>
</html>
